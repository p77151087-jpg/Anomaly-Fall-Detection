pose:
  backend: lightweight_openpose
  weights_manifest: weights/openpose18-manifest.json
  upstream_dir: third_party/lightweight_openpose
  backbone: mobilenet_v1
  input_height: 256
  refinement_stages: 3
  inference_refinement_stage: 1
  track_similarity_joints: 3
  rotation_angles:
  - 0
  - -90
  - 90
  rotation_policy: low_quality
skeleton:
  recipe_id: lightweight_openpose18_stgcn_kinetics_v1
  target_fps: 30
  window_size: 30
  stride: 5
quality:
  min_joint_confidence: 0.2
  min_valid_joints: 12
  min_good_frame_ratio: 0.8
features:
  backend: stgcn_kinetics
  expected_dim: 256
  upstream_dir: third_party/stgcn
  frozen: true
data:
  cache_dir: data/cache/le2i-extension-selective
  allow_missing_timestamp_tail: true
  dataset: urfall_le2i
  raw_dir: data/raw
  manifest_dir: data/manifests/le2i-extension
  protocol_id: urfall-plus-le2i-cs-sequence-v1
